<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed"><title>Free Mail · serveur arrêté</title>
<style>:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px/1.5 -apple-system,Roboto,Segoe UI,sans-serif;background:#0b0d14;color:#e8e9f1;padding:24px;box-sizing:border-box}
@media (prefers-color-scheme:light){body{background:#f6f7fb;color:#151826}.card{background:#fff!important}}
.card{max-width:420px;background:#151826;border-radius:20px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
img{width:64px;height:64px;border-radius:16px}h1{font-size:20px;margin:14px 0 6px}code{background:rgba(124,58,237,.15);padding:2px 6px;border-radius:6px}
button{margin-top:16px;width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;font:inherit;font-weight:700}</style></head>
<body><div class="card"><img src="/icons/icon-192.png" alt=""><h1>Le serveur Free Mail ne répond pas</h1>
<p>Le serveur tourne dans Termux sur ce téléphone. Ouvre Termux et lance <code>~/free-mail/termux/start.sh</code>, ou utilise le widget « FreeMail ».</p>
<p style="opacity:.7;font-size:13px">Après un redémarrage du téléphone, Termux:Boot le relance tout seul.</p>
<button onclick="location.reload()">Réessayer</button></div></body></html>
