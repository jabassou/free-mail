# Weekly dependency updates, opened as PRs against dev.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: pip
    directories: ["/", "/tests"]
    target-branch: dev
    schedule: { interval: weekly, day: monday }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: gradle
    directory: /android
    target-branch: dev
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 1.17+ needs compileSdk 36/37 and AGP 9: comes with the AGP 9 migration
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.17.0"]
    schedule: { interval: weekly, day: monday }
    groups:
      android: { patterns: ["*"] }
