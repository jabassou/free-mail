name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt

      - name: IMAP test server (Dovecot)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq dovecot-imapd
          sudo systemctl stop dovecot || true
          sudo tests/dovecot.sh start

      - name: Python dependencies
        run: |
          pip install -r requirements.txt -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Tests
        run: python -m pytest -q --junitxml=junit.xml

      - name: Dovecot log
        if: failure()
        run: sudo tail -50 /tmp/fm-dovecot/dovecot.log || true
