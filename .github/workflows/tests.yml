name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt

      - name: IMAP test server (Dovecot)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq dovecot-imapd
          sudo systemctl stop dovecot || true
          sudo tests/dovecot.sh start

      - name: Python dependencies
        run: |
          pip install --require-hashes -r tests/requirements-ci.txt
          python -m playwright install --with-deps chromium

      - name: Tests
        run: python -m pytest -q --junitxml=junit.xml

      - name: Dovecot log
        if: failure()
        run: sudo tail -50 /tmp/fm-dovecot/dovecot.log || true
